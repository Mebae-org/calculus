# MAGI
name: 課題01 [CHAPTER TITLE] の提出
description: 第1章「[CHAPTER TITLE]」の課題を提出します
title: "[課題01] [CHAPTER TITLE]"
labels: ["assignment", "ch01"]
body:
  - type: markdown
    attributes:
      value: |
        各問について、答えだけでなく、考え方が分かる途中式または説明を記述してください。
  - type: textarea
    id: q1
    attributes:
      label: 問1
      description: "[QUESTION 1]"
      placeholder: 答えと途中式または説明を入力
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2
      description: "[QUESTION 2]"
      placeholder: 答えと途中式または説明を入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
# /MAGI
