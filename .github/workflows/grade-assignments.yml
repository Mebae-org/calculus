# MAGI
name: 課題の自動採点

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: grade-assignment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: 教材を取得
        uses: actions/checkout@v4

      - name: 数値解答を採点
        uses: actions/github-script@v7
        with:
          script: |
            const grader = require('./.github/scripts/grade-assignment.cjs');
            await grader.run({ github, context, core });
# /MAGI
